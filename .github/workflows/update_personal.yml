name: CI UPDATE PERSONAL
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: personal
        fetch-depth: 0
    - uses: oleksiyrudenko/gha-git-credentials@v2
      with:
        token: '${{ secrets.GITHUB_TOKEN }}'
    - run: git merge origin/master --no-edit
    - run: git push origin personal
